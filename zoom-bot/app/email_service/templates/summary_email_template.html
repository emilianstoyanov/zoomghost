<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f0f0f0;
          margin: 0;
          padding: 0;
        }
        .container {
          max-width: 600px;
          margin: 40px auto;
          background-color: #ffffff;
          padding: 30px;
          border-radius: 8px;
          box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
          color: #333333;
        }
        p, ul {
          color: #555555;
          font-size: 15px;
        }
        .footer {
          font-size: 12px;
          color: #888888;
          margin-top: 30px;
          border-top: 1px solid #eee;
          padding-top: 15px;
          text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>{{ heading }}</h2>

    <p>Hello,</p>
    <p>Here is a short summary of the meeting:</p>

    <div style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 10px;">
        {{ summary | safe }}
    </div>

    <p style="margin-top: 30px;">Thank you for using <strong>ZoomGhost</strong>!</p>

    <div class="footer">
        This email was generated automatically.<br>
        Questions: <a href="contact.zoomghost@gamil.com">contact.zoomghost@gamil.com</a>
    </div>
</div>
</body>
</html>
